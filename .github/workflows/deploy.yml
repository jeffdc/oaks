name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false  # Don't cancel production deploys

# The GITHUB_TOKEN only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Only deploy main: after CI succeeds on it, or a manual run started from main
    # (a manual run from any other branch would put that branch in production).
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Check out the exact commit CI tested, not whatever main is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    # Toolchain from the flake's dev shell (flake.nix), same as CI and local dev.
    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
    steps:
      # Check out the exact commit CI tested, not whatever main is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: cachix/install-nix-action@v31

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      # Restore only: a deploy run never saves the cache, so nothing it checks out can
      # poison the cache that CI and later deploys restore (CodeQL cache-poisoning).
      - name: Restore dependencies cache
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run smoke tests
        run: mix smoke_test https://oakcompendium.org
