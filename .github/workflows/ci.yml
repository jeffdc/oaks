name: CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'assets/**'
      - 'priv/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'API_VERSION'
      - 'Dockerfile'
      - 'fly.toml'
      - 'docker-entrypoint.sh'
      - 'litestream.yml'
      - 'rel/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/**'
      - 'dev/**'
      - '.credo.exs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Toolchain comes from the flake's dev shell (flake.nix), the same one used locally.
# Steps run through `nix develop`; the shell is pre-built in its own step so a broken
# shell fails clearly and doesn't skew step timings.

# The GITHUB_TOKEN only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  # What the pull request changes (heartwood's actions/changes, with
  # dev/guardrails/config.sh): one that changes only prose skips the jobs
  # below. They also run if this job fails, so a broken classifier never
  # skips them; a push or a schedule counts as changing everything. The
  # action's tag moves with @heartwood_tag in mix.exs.
  changes:
    name: CI changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        uses: jeffdc/heartwood/guardrails/actions/changes@v0.2.3

  phoenix:
    name: Phoenix
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check Dockerfile matches the flake toolchain
        run: deps/heartwood_guardrails/guardrails/bin/check-toolchain

      - name: Setup test database
        run: |
          rm -f priv/oaks_test.sqlite*
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet
          sqlite3 priv/oaks_test.sqlite < priv/repo/test_seeds.sql

      # The tests include the guardrails: the UI rules (OaksWeb.Conformance),
      # copied code and retirements (Oaks.GuardrailsTest).
      - name: Run precommit checks (format, compile, credo, tests)
        run: mix precommit

  assets:
    name: Assets
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (generates colocated hooks)
        run: mix compile

      - name: Build assets
        run: mix assets.deploy

  # A separate job so the PLT cache (priv/plts) can key on its own; it's rebuilt
  # only when deps or the toolchain change.
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}

    env:
      MIX_ENV: dev

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies and PLT cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: |
          mkdir -p priv/plts
          mix dialyzer --format github --format dialyxir

  # The public API's version: a pull request that changes the API's controllers or
  # spec must bump API_VERSION (as gallformers' CI does).
  api-version-check:
    name: API Version Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if API files changed without version bump
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          # Quoted, so git (not the shell) matches the pathspecs.
          API_PATHS=('lib/oaks_web/controllers/api/**' 'lib/oaks_web/api_spec.ex')

          # Check if any API controller or spec files changed
          API_CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA -- "${API_PATHS[@]}" | wc -l)

          # Check if API_VERSION changed
          VERSION_CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA -- 'API_VERSION' | wc -l)

          if [ "$API_CHANGED" -gt 0 ] && [ "$VERSION_CHANGED" -eq 0 ]; then
            echo "::error::API files changed but API_VERSION was not updated!"
            echo ""
            echo "Changed API files:"
            git diff --name-only $BASE_SHA $HEAD_SHA -- "${API_PATHS[@]}"
            echo ""
            echo "When modifying the REST API, you must bump the version in API_VERSION"
            echo "Current version: $(cat API_VERSION)"
            exit 1
          fi
