name: CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'assets/**'
      - 'priv/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'Dockerfile'
      - 'fly.toml'
      - 'docker-entrypoint.sh'
      - 'litestream.yml'
      - 'rel/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'assets/**'
      - 'priv/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'Dockerfile'
      - 'fly.toml'
      - 'docker-entrypoint.sh'
      - 'litestream.yml'
      - 'rel/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Toolchain comes from the flake's dev shell (flake.nix), the same one used locally.
# Steps run through `nix develop`; the shell is pre-built in its own step so a broken
# shell fails clearly and doesn't skew step timings.

jobs:
  phoenix:
    name: Phoenix
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Check Dockerfile matches the flake toolchain
        run: scripts/check-toolchain

      - name: Install dependencies
        run: mix deps.get

      - name: Setup test database
        run: |
          rm -f priv/oaks_test.sqlite*
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet
          sqlite3 priv/oaks_test.sqlite < priv/repo/test_seeds.sql

      - name: Run precommit checks (format, compile, credo, tests)
        run: mix precommit

  assets:
    name: Assets
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (generates colocated hooks)
        run: mix compile

      - name: Build assets
        run: mix assets.deploy
