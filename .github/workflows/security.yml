name: Security Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.beads/**'
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  elixir-audit:
    name: Elixir Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check retired Hex packages
        run: mix hex.audit

      - name: Audit Mix dependencies for vulnerabilities
        run: mix deps.audit

      - name: Run Sobelow security scanner
        run: mix sobelow --exit high --private

  pip-audit:
    name: Pip Audit (Scraper)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install scraper dependencies
        run: pip install -r scrapers/oaksoftheworld/requirements.txt

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true
