name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/security.yml'
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  elixir-audit:
    name: Elixir Security Audit
    runs-on: ubuntu-latest

    # Toolchain from the flake's dev shell (flake.nix), same as CI and local dev.
    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check retired Hex packages
        run: mix hex.audit

      - name: Audit Mix dependencies for vulnerabilities
        run: mix deps.audit

      - name: Run Sobelow security scanner
        run: mix sobelow --exit high --private
