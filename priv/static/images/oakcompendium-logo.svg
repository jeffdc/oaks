<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg { fill: #1f3a2d; }
      .fg { fill: #f3ecd8; }
    </style>
  </defs>

  <!-- Acorn body -->
  <path class="bg" d="
    M140 180
    C140 120, 372 120, 372 180
    L372 210
    C372 330, 315 390, 256 438
    C197 390, 140 330, 140 210
    Z"/>

  <!-- Stem -->
  <rect class="bg" x="236" y="72" width="40" height="48" rx="10"/>

  <!-- Cap -->
  <path class="bg" d="
    M120 170
    C120 90, 392 90, 392 170
    C392 205, 370 220, 350 220
    L162 220
    C142 220, 120 205, 120 170
    Z"/>

  <!-- Cap pattern -->
  <g class="fg" opacity="0.95">
    <rect x="165" y="125" width="30" height="20" rx="5" transform="rotate(45 180 135)"/>
    <rect x="215" y="118" width="30" height="20" rx="5" transform="rotate(45 230 128)"/>
    <rect x="265" y="118" width="30" height="20" rx="5" transform="rotate(45 280 128)"/>
    <rect x="315" y="125" width="30" height="20" rx="5" transform="rotate(45 330 135)"/>

    <rect x="190" y="155" width="30" height="20" rx="5" transform="rotate(45 205 165)"/>
    <rect x="240" y="148" width="30" height="20" rx="5" transform="rotate(45 255 158)"/>
    <rect x="290" y="155" width="30" height="20" rx="5" transform="rotate(45 305 165)"/>
  </g>

  <!-- Book / sprout -->
  <path class="fg" d="
    M256 230
    C230 215, 195 214, 170 225
    L170 345
    C198 330, 225 330, 248 346
    Z"/>

  <path class="fg" d="
    M256 230
    C282 215, 317 214, 342 225
    L342 345
    C314 330, 287 330, 264 346
    Z"/>

  <!-- Inner page curves -->
  <path d="M190 255 C205 280, 215 305, 220 330"
        fill="none" stroke="#1f3a2d" stroke-width="10" stroke-linecap="round"/>

  <path d="M322 255 C307 280, 297 305, 292 330"
        fill="none" stroke="#1f3a2d" stroke-width="10" stroke-linecap="round"/>
</svg>
